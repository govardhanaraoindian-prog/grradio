name: Flutter Web Build

on:
  push:
    branches:
      - main # Trigger on push to the main branch
  pull_request:
    branches:
      - main # Trigger on pull request targeting main

jobs:
  build:
    # Use an Ubuntu runner for the GitHub Action
    runs-on: ubuntu-latest

    steps:
      - name: 1. ⚙️ Checkout Repository
        # Action to check out the code
        uses: actions/checkout@v4

      - name: 2. 🐦 Setup Flutter Environment
        # Action to install Flutter and configure the environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Use the stable channel
          # If your project requires a specific version, you can specify it here:
          # flutter-version: '3.10.0'

      - name: 3. 🖥️ Enable Web Support
        # Ensure the runner has web support enabled
        run: flutter config --enable-web

      - name: 4. 📦 Install Dependencies
        # Get all packages defined in pubspec.yaml
        run: flutter pub get

      # --- Optional: Run Tests ---
      - name: 5. 🧪 Run Tests (Optional)
        run: flutter test

      - name: 6. 🌐 Build Flutter Web
        # The main build command for web. This generates the production files.
        run: flutter build web --release

      - name: 7. 🎁 Archive Web Build Artifact
        # Upload the generated build files (the 'web' output directory)
        # The built files are located in the 'build/web' directory.
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web/
          # Retention period for the artifact (e.g., 5 days)
          retention-days: 5
